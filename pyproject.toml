[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "split-harm"
version = "0.1.0"
description = "Split-harm detector sandbox for multi-agent tool-using teams (Apart Swarm Alignment 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["split_harm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
